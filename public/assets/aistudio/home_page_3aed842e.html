<div id="homeView" class="app-view d-none">
  <div class="container-fluid">
    <!-- Dashboard Tabs -->
    <div class="card border-0 shadow mb-4">
      <div class="card-body p-3">
        <div class="d-flex flex-wrap gap-2" id="dashboardTabs">
          <button type="button" class="btn btn-primary dashboard-tab active" data-tab="patientsByService">
            <i class="fa-solid fa-users me-1"></i>จำนวนผู้ป่วยตามหน่วยบริการ
          </button>
          <button type="button" class="btn btn-outline-secondary dashboard-tab" data-tab="fundusByService">
            <i class="fa-solid fa-eye me-1"></i>Dashboard ตรวจตา
          </button>
        </div>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboardContent">
      <!-- Tab: จำนวนผู้ป่วยตามหน่วยบริการ -->
      <div id="tab-patientsByService" class="dashboard-tab-content">
        <div class="card border-0 shadow">
          <div class="card-header bg-white">
            <h6 class="mb-0">
              <i class="fa-solid fa-users me-2"></i>จำนวนผู้ป่วยจำแนกตามชื่อหน่วยบริการ
            </h6>
          </div>
          <div class="card-body">
            <div id="patientsByServiceLoader" class="text-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <div class="mt-2 text-muted small">กำลังโหลดข้อมูล...</div>
            </div>
            <div id="patientsByServiceContent" class="d-none">
              <div style="height: 400px; position: relative;">
                <canvas id="patientsByServiceChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tab: Dashboard ตรวจตา -->
      <div id="tab-fundusByService" class="dashboard-tab-content d-none">
        <div class="card border-0 shadow">
          <div class="card-header bg-white">
            <h6 class="mb-0">
              <i class="fa-solid fa-eye me-2"></i>Dashboard ตรวจตา - สรุปตามสถานที่และผลการตรวจ
            </h6>
          </div>
          <div class="card-body">
            <div id="fundusByServiceLoader" class="text-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <div class="mt-2 text-muted small">กำลังโหลดข้อมูล...</div>
            </div>
            <div id="fundusByServiceContent" class="d-none">
              <!-- Filters -->
              <div class="card mb-3" style="background-color: #f8f9fa;">
                <div class="card-body py-2">
                  <div class="row g-2 align-items-center">
                    <div class="col-auto">
                      <label class="form-label small mb-1 fw-bold text-primary">
                        <i class="fa-solid fa-filter me-1"></i>ตัวกรอง
                      </label>
                    </div>
                    <div class="col-auto">
                      <select class="form-select form-select-sm" id="fundusYearFilter" style="width: 150px;">
                        <option value="">ปีงบประมาณ</option>
                      </select>
                    </div>
                    <div class="col-auto">
                      <select class="form-select form-select-sm" id="fundusLocationFilter" style="width: 200px;">
                        <option value="">สถานที่</option>
                      </select>
                    </div>
                    <div class="col-auto">
                      <button type="button" class="btn btn-outline-secondary btn-sm" id="btnResetFundusFilters">
                        <i class="fa-solid fa-rotate-left me-1"></i>รีเซ็ต
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Chart -->
              <div class="card mb-3">
                <div class="card-body">
                  <div class="mb-4">
                    <!-- <h6 class="small text-muted mb-2">สรุปจำนวนการตรวจตาตามสถานที่</h6> -->
                    <div style="height: 200px; position: relative;">
                      <div id="fundusChartPlaceholder" class="text-center text-muted py-5">
                        <i class="fa-solid fa-chart-simple me-2"></i>กรุณาเลือกตัวกรองเพื่อแสดงกราฟ
                      </div>
                      <canvas id="fundusByLocationChart" style="display: none;"></canvas>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Table -->
              <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" style="width: 100%;">
                  <thead class="table-light">
                    <tr>
                      <th class="text-center" style="width: 60px;">ลำดับ</th>
                      <th class="text-center">วันที่ตรวจตา</th>
                      <th>สถานที่</th>
                      <th class="text-center">จำนวนทั้งหมด</th>
                      <th class="text-center">No DR</th>
                      <th class="text-center">Mild NPDR</th>
                      <th class="text-center">Moderate NPDR</th>
                      <th class="text-center">Severe NPDR</th>
                      <th class="text-center">PDR</th>
                      <th class="text-center">Poor View</th>
                    </tr>
                  </thead>
                  <tbody id="fundusByServiceTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
