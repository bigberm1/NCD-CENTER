<style>
  :root {

    /* 
  --info: #3b82f6;
  --info-hover: #2563eb;
  --info-soft: #dbeafe;
  --success: #10b981;
  --success-hover: #059669;
  --success-soft: #E2F7E4;
  --warning: #f59e0b;
  --warning-hover: #d97706;
  --warning-soft: #fffbeb;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --danger-soft: #fef2f2;
 */
    --primary: #374151;
    --primary-hover: #1f2937;
    --primary-soft: #eef0f3;
    --primary-50: #f3f4f6;
    --info: #4b5563;
    --info-hover: #374151;
    --info-soft: #f3f4f6;
    --success: #4b5563;
    --success-hover: #374151;
    --success-soft: #f3f4f6;
    --warning: #6b7280;
    --warning-hover: #4b5563;
    --warning-soft: #f3f4f6;
    --danger: #dc3545;
    --danger-hover: #dc2626;
    --danger-soft: #fef2f2;
    --bg: #f8f9fb;
    --white: #ffffff;
    --text: #374151;
    --text-strong: #1f2937;
    --muted: #6b7280;
    --muted-light: #9ca3af;
    --border: #e5e7eb;
    --border-soft: #eceef1;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);

    /* Additional variables for patients page */
    --app-muted: #6b7280;
    --app-gray: #6b7280;
    --app-blue-soft: #e3f2fd;
    --app-orange-soft: #fff3e0;
    --app-purple-soft: #f3e5f5;
  }

  * {
    font-family: 'Sarabun', sans-serif !important;
  }

  html,
  body {
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.5;
    font-weight: 400;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-weight: 600;
    color: var(--text-strong);
  }

  strong,
  b {
    font-weight: 600;
  }

  /* ---------- Buttons ---------- */
  .btn {
    border-radius: 8px;
    font-weight: 500;
    transition: background-color .15s ease, box-shadow .15s ease, border-color .15s ease, opacity .15s ease;
    border: 1px solid transparent;
    padding: .5rem .9rem;
    font-size: .92rem;
  }

  .btn-primary {
    background-color: var(--primary);
    border-color: var(--primary);
    color: var(--white);
  }

  .btn-primary:hover,
  .btn-primary:focus,
  .btn-primary:active {
    background-color: var(--primary-hover) !important;
    border-color: var(--primary-hover) !important;
    color: var(--white) !important;
    box-shadow: 0 2px 8px rgba(55, 65, 81, .18);
  }

  .btn-success {
    background-color: var(--success);
    border-color: var(--success);
    color: var(--white);
  }

  .btn-success:hover,
  .btn-success:focus,
  .btn-success:active {
    background-color: var(--success-hover) !important;
    border-color: var(--success-hover) !important;
    color: var(--white) !important;
    box-shadow: 0 2px 8px rgba(16, 185, 129, .18);
  }

  .btn-warning {
    background-color: var(--warning);
    border-color: var(--warning);
    color: var(--white);
  }

  .btn-warning:hover,
  .btn-warning:focus,
  .btn-warning:active {
    background-color: var(--warning-hover) !important;
    border-color: var(--warning-hover) !important;
    color: var(--white) !important;
    box-shadow: 0 2px 8px rgba(245, 158, 11, .18);
  }

  .btn-danger {
    background-color: var(--danger);
    border-color: var(--danger);
    color: var(--white);
  }

  .btn-danger:hover,
  .btn-danger:focus,
  .btn-danger:active {
    background-color: var(--danger-hover) !important;
    border-color: var(--danger-hover) !important;
    color: var(--white) !important;
    box-shadow: 0 2px 8px rgba(239, 68, 68, .18);
  }

  .btn-info {
    background-color: var(--info);
    border-color: var(--info);
    color: var(--white);
  }

  .btn-info:hover,
  .btn-info:focus,
  .btn-info:active {
    background-color: var(--info-hover) !important;
    border-color: var(--info-hover) !important;
    color: var(--white) !important;
    box-shadow: 0 2px 8px rgba(59, 130, 246, .18);
  }

  .btn-outline-secondary {
    color: var(--muted);
    border-color: var(--border);
    background-color: var(--white);
  }

  .btn-outline-secondary:hover {
    color: var(--primary);
    border-color: var(--primary);
    background-color: var(--primary-50);
  }

  .btn-sm {
    padding: .35rem .7rem;
    font-size: .85rem;
  }

  /* ---------- Text helpers ---------- */
  .text-primary {
    color: var(--primary) !important;
  }

  .text-success {
    color: var(--success) !important;
  }

  .text-warning {
    color: var(--warning) !important;
  }

  .text-danger {
    color: var(--danger) !important;
  }

  .text-info {
    color: var(--info) !important;
  }

  .text-muted {
    color: var(--muted) !important;
  }

  .text-muted-light {
    color: var(--muted-light) !important;
  }

  /* ---------- Login page (ถูกซ่อนไว้ แต่เตรียมสีให้สอดคล้อง) ---------- */
  .login-wrap {
    background-color: var(--bg);
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    background-color: var(--white);
    border-radius: 12px !important;
    box-shadow: var(--shadow-md);
  }

  .login-logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background-color: var(--primary-soft);
    color: var(--primary);
    font-size: 28px;
  }

  .login-card .form-control {
    border-radius: 8px !important;
    padding: .5rem .8rem;
    border: 1px solid var(--border);
    background-color: var(--white);
    transition: all .15s ease;
  }

  .login-card .form-control:focus {
    border-color: var(--primary);
    background-color: var(--white);
    box-shadow: 0 0 0 .18rem rgba(55, 65, 81, .08);
  }

  /* ---------- Cards ---------- */
  .card {
    background-color: var(--white);
    border-radius: 12px !important;
    border: 1px solid var(--border-soft);
  }

  .card.shadow-sm {
    box-shadow: var(--shadow-sm) !important;
  }

  /* ---------- Inputs / Form ---------- */
  .form-control,
  .form-select {
    /* border-radius: 8px !important; */
    padding: .45rem .75rem;
    border: 1px solid var(--border);
    background-color: var(--white);
    transition: all .12s ease;
    font-size: .92rem;
    color: var(--text-strong);
  }

  .form-control:focus,
  .form-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 .18rem rgba(55, 65, 81, .08);
    background-color: var(--white);
    outline: none;
  }

  .form-control.bg-light {
    background-color: var(--bg) !important;
  }

  .form-label {
    color: var(--text-strong);
    margin-bottom: .28rem;
    font-weight: 700;
    font-size: .88rem;
  }

  .form-text {
    font-size: .8rem;
    color: var(--muted);
  }

  .invalid-feedback {
    font-size: .82rem;
  }

  /* ---------- App wrapper & container spacing ---------- */
  #appSection {
    min-height: 100vh;
  }

  .container-xl {
    padding-left: 1rem !important;
    padding-right: 1rem !important;
    padding-top: 1.25rem !important;
    padding-bottom: 1.5rem !important;
  }

  /* ---------- Search Card ---------- */
  .search-card .card-body {
    padding: 1.1rem 1.25rem !important;
  }

  .search-card .form-label {
    font-weight: 500 !important;
    font-size: .9rem;
  }

  /* ---------- Results header ---------- */
  #resultsArea h6 {
    font-weight: 500;
    font-size: .95rem;
  }

  #resultCount {
    font-weight: 600;
    font-size: 1.05rem !important;
  }

  /* ---------- Person result card ---------- */
  .person-card {
    border-radius: 14px;
    overflow: hidden;
    background-color: var(--white);
    border: 1px solid var(--border-soft);
    box-shadow: var(--shadow-sm);
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  .person-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--border);
  }

  .person-card-header {
    background-color: var(--primary);
    color: var(--white);
    padding: .8rem 1.15rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .75rem;
  }

  .person-card-header .hn-badge {
    background-color: rgba(255, 255, 255, .18);
    color: var(--white);
    padding: .22rem .6rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: .85rem;
  }

  .person-card-header .name-main {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.25;
  }

  .person-card-header .cid-sub {
    font-size: .85rem;
    opacity: .9;
    margin-top: .15rem;
    font-weight: 400;
  }

  .person-card-header .meta-top {
    margin-left: auto;
    display: flex;
    gap: .45rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .person-card-body {
    padding: 1.05rem 1.15rem .6rem;
  }

  /* Group layout */
  .card-group {
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: .8rem 1rem 1rem;
    margin-bottom: .9rem;
    background-color: var(--bg);
  }

  .card-group:last-child {
    margin-bottom: 0;
  }

  .card-group-title {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-weight: 600;
    color: var(--primary);
    font-size: .92rem;
    padding: .15rem .65rem;
    margin: 0 0 .65rem;
    background-color: var(--white);
    border: 1px solid var(--border);
    border-radius: 999px;
  }

  /* Label-left / Value-right rows */
  .info-list {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0;
  }

  @media (min-width: 768px) {
    .info-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 1.4rem;
    }
  }

  .info-row {
    display: flex;
    align-items: flex-start;
    padding: .38rem 0;
    border-bottom: 1px dashed var(--border-soft);
  }

  .info-row:last-child,
  .info-row:nth-last-child(2):nth-child(odd) {
    border-bottom: none;
  }

  @media (min-width: 768px) {
    .info-row:nth-last-child(-n+2) {
      border-bottom: none;
    }
  }

  .info-label {
    width: 42%;
    flex-shrink: 0;
    color: var(--muted);
    font-weight: 500;
    font-size: .86rem;
    padding-right: .65rem;
    line-height: 1.5;
  }

  .info-value {
    flex: 1 1 auto;
    color: var(--text-strong);
    font-weight: 500;
    font-size: .89rem;
    word-break: break-word;
    line-height: 1.5;
  }

  .info-value.empty {
    color: var(--muted-light);
    font-weight: 400;
  }

  .info-value.empty::before {
    content: "-";
    color: var(--muted-light);
    margin-right: 0;
    font-weight: 400;
  }

  /* Flatpickr grayscale theme */
  .flatpickr-calendar {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    color: var(--text);
    font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .flatpickr-months .flatpickr-month,
  .flatpickr-months .flatpickr-prev-month,
  .flatpickr-months .flatpickr-next-month,
  .flatpickr-weekdays,
  span.flatpickr-weekday {
    background: #ffffff;
    color: var(--text-strong);
    fill: var(--text-strong);
  }

  span.flatpickr-weekday {
    background: var(--primary-50);
    color: var(--text-strong);
    font-weight: 600;
  }

  .flatpickr-day {
    color: var(--text);
    border-radius: 8px;
  }

  .flatpickr-day:hover {
    background-color: var(--primary-50);
    border-color: var(--border);
    color: var(--text-strong);
  }

  .flatpickr-day.selected,
  .flatpickr-day.startRange,
  .flatpickr-day.endRange,
  .flatpickr-day.selected.inRange,
  .flatpickr-day.startRange.inRange,
  .flatpickr-day.endRange.inRange,
  .flatpickr-day.selected:focus,
  .flatpickr-day.startRange:focus,
  .flatpickr-day.endRange:focus,
  .flatpickr-day.selected:hover,
  .flatpickr-day.startRange:hover,
  .flatpickr-day.endRange:hover {
    background: var(--primary);
    border-color: var(--primary);
    color: #ffffff;
  }

  .flatpickr-day.today {
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 700;
  }

  .flatpickr-day.today:hover {
    background: var(--primary);
    color: #ffffff;
  }

  .flatpickr-current-month .flatpickr-monthDropdown-months,
  .flatpickr-current-month input.cur-year {
    font-family: inherit;
    color: var(--text-strong);
  }

  .flatpickr-current-month input.cur-year {
    font-weight: 600;
  }

  .numInputWrapper:hover {
    background: var(--primary-50);
  }

  .flatpickr-calendar.arrowTop::before,
  .flatpickr-calendar.arrowTop::after {
    border-bottom-color: var(--border);
  }

  /* Status & chronic chips */
  .chronic-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin-top: .15rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font-size: .8rem;
    padding: .22rem .55rem;
    border-radius: 999px;
    font-weight: 500;
  }

  .chip-ht {
    background: var(--primary-50);
    border: 1px solid var(--border);
    font-size: 0.85rem;
  }

  .chip-dm {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
    font-size: 0.85rem;
  }

  .chip-dlp {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
    font-size: 0.85rem;
  }

  .chip-chronic {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
  }

  .status-live {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
  }

  .status-dead {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
  }

  .status-move {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
  }

  .status-miss {
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
  }

  /* ---------- New Patient Card Layout ---------- */
  .patient-detail-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    padding: 1rem 1.15rem 0.6rem;
  }

  @media (min-width: 992px) {
    .patient-detail-layout {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 1rem;
    }

    .patient-main-col {
      grid-row: 1 / span 3;
      grid-column: 1;
    }

    .patient-chronic-col {
      grid-row: 1;
      grid-column: 2;
    }

    .patient-service-col {
      grid-row: 2;
      grid-column: 2;
    }

    .patient-status-col {
      grid-row: 3;
      grid-column: 2;
    }
  }

  .patient-main-card,
  .patient-side-card {
    background-color: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 1rem 1.1rem 1.1rem;
  }

  .patient-main-card .patient-name-head {
    margin-bottom: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-soft);
  }

  .patient-main-card .patient-fullname {
    font-size: 1.85rem;
    font-weight: 700;
    color: var(--text-strong);
    line-height: 1.25;
    margin-bottom: 0.8rem;
  }

  .patient-main-card .patient-ids {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .patient-ids .hn-pill,
  .patient-ids .cid-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.25rem 0.7rem;
    border-radius: 999px;
    font-size: 1.2rem;
    font-weight: 600;
    background: var(--primary-50);
    color: var(--text-strong);
    border: 1px solid var(--border);
  }

  .patient-side-card .side-card-title {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-weight: 600;
    color: var(--white);
    font-size: 0.92rem;
    padding: 0.15rem 0.65rem;
    margin: 0 0 0.65rem;
    /* background-color: var(--primary-50); */
    background-color: #2859a8;
    border: 1px solid var(--border);
    border-radius: 999px;
  }

  .side-info-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .side-info-row {
    display: flex;
    align-items: flex-start;
    padding: 0.2rem 0;
    border-bottom: 1px dashed var(--border-soft);
  }

  .side-info-row:last-child {
    border-bottom: none;
  }

  .side-info-label {
    width: 42%;
    flex-shrink: 0;
    color: var(--muted);
    font-weight: 500;
    font-size: 0.86rem;
    padding-right: 0.65rem;
    line-height: 1.5;
  }

  .side-info-value {
    flex: 1 1 auto;
    color: var(--text-strong);
    font-weight: 500;
    font-size: 0.89rem;
    word-break: break-word;
    line-height: 1.5;
  }

  .side-info-value.empty {
    color: var(--muted-light);
    font-weight: 400;
  }

  .side-info-value.empty::before {
    content: "-";
    color: var(--muted-light);
    margin-right: 0;
    font-weight: 400;
  }

  .search-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-soft);
  }

  .search-card-title {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-weight: 600;
    color: var(--text-strong);
    font-size: 1rem;
  }

  .search-card-title i {
    color: var(--primary);
    font-size: 1.05rem;
  }

  .search-card-user {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.86rem;
    color: var(--text);
    padding: 0.22rem 0.6rem;
    background-color: var(--primary-50);
    border-radius: 999px;
    border: 1px solid var(--primary-soft);
  }

  .search-card-user i {
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* Meta (เวลาแก้ไข / คนแก้ไข) */
  .meta-update {
    font-size: .8rem;
    color: var(--muted);
    padding: .55rem 1.15rem .15rem;
    background: var(--bg);
    display: flex;
    flex-wrap: wrap;
    gap: .55rem .9rem;
    justify-content: space-between;
    border-top: 1px solid var(--border-soft);
  }

  .meta-update .meta-left,
  .meta-update .meta-right {
    display: inline-flex;
    gap: .45rem;
    flex-wrap: wrap;
  }

  .meta-pill {
    background-color: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: .22rem .58rem;
    font-size: .78rem;
    color: var(--text);
  }

  .meta-pill strong {
    color: var(--primary);
    font-weight: 600;
  }

  /* Card Footer */
  .person-card-footer {
    padding: .65rem 1.15rem .85rem;
    background-color: var(--bg);
    border-top: 1px solid var(--border-soft);
    display: flex;
    gap: .5rem;
    justify-content: flex-end;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ---------- Empty result ---------- */
  .no-results-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background-color: var(--primary-soft);
    color: var(--primary);
    font-size: 28px;
    box-shadow: inset 0 0 0 3px var(--white);
  }

  #noResultsArea .card-body {
    padding: 2.5rem 1.25rem !important;
  }

  #noResultsArea h5 {
    font-weight: 600;
    font-size: 1.05rem;
  }

  /* ---------- Modal ---------- */
  .modal-content {
    background-color: var(--white);
    border-radius: 14px !important;
    border: none;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .15);
  }

  .modal-header-custom {
    background-color: var(--primary);
    color: var(--white);
    padding: .8rem 1.25rem;
    border-radius: 14px 14px 0 0 !important;
    border-bottom: none;
  }

  .modal-header-custom .modal-title {
    font-weight: 600;
    font-size: 1rem;
  }

  .modal-header-custom .btn-close {
    filter: brightness(2.2);
  }

  .bg-form,
  .bg-form-footer {
    background-color: var(--bg);
  }

  /* Modal scroll fix */
  .modal-dialog-scrollable {
    max-height: calc(100vh - 2rem);
    display: flex;
    align-items: center;
  }

  .modal-dialog-scrollable .modal-content {
    overflow: hidden !important;
    display: flex !important;
    flex-direction: column !important;
    max-height: calc(100vh - 2rem) !important;
    height: auto;

    overflow-x: hidden !important;

  .modal-dialog-scrollable .modal-header,
  .modal-dialog-scrollable .modal-footer {

  /* =========================================================

  :root {

    --primary-border: #cbd9ef;
    --text-strong: #344054;
    --text: #516077;
    --muted: #7b8794;
    --white: #fff;
    --border: #e4e9f0;
    --border-soft: #edf0f4;
    --app-bg: #f7f9fc;
    --app-surface: #fff;
    --app-border: #e5e9ef;
    --app-blue: #64CAFA;
    --app-blue-soft: #D2EFFD;
    --app-green: #65E39F;
    --app-green-soft: #DEF6E9;
    --app-orange: #FFAD8C;
    --app-orange-soft: #FFE8DE;
    --app-yellow: #FFDB66;
    --app-yellow-soft: #FFF4D0;
    --app-pink: #FFB3B3;
    --app-pink-soft: #FFE6E6;
    --app-purple: #C096FA;
    --app-purple-soft: #E6D7FB;
    --app-gray: #516077;
    --app-gray-soft: #A6B0BC;

  body {

    background: var(--app-bg);
    color: var(--text)
