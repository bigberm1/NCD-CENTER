<script>

  (function (NCDApp) {
  'use strict';

  // Shared Core services/state supplied by app.html + js.html.
  const state = NCDApp.state;
  const el = NCDApp.el;
  const core = NCDApp.core || {};
  const getCurrentUser = core.getCurrentUser;
  const handleNeedLogin = core.handleNeedLogin;
  const setBtnLoading = core.setBtnLoading;
  const resetBtn = core.resetBtn;
  const escapeHtml = core.escapeHtml;
  const formatHN = core.formatHN;
  const formatCID = core.formatCID;
  const toast = core.toast;
  const showError = core.showError;
  const confirmDialog = core.confirmDialog;

  /* ---------- TeleMedicine ---------- */

  function getTelemedHospitalFromSelect_(selectedValue) {
    const v = String(selectedValue || '').trim();
    if (!v) return { code: '', name: '' };
    try {
      const obj = JSON.parse(v);
      if (obj && typeof obj === 'object') {
        return { code: String(obj.code || ''), name: String(obj.name || '') };
      }
    } catch (e) {}
    return { code: v, name: v };
  }

  function fetchTelemedDates() {
    return new Promise(function (resolve) {
      const user = getCurrentUser();
      if (!user) { resolve(); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) { resolve(); return; }
          if (res.needLogin) { handleNeedLogin(); resolve(); return; }
          if (!res.success) { if (res.message) toast(res.message, 'error', 2000); resolve(); return; }
          state.telemedDates = Array.isArray(res.dates) ? res.dates : [];
          renderTelemedDateList();
          resolve();
        })
        .withFailureHandler(function () { resolve(); })
        .getTelemedDates(user);
    });
  }

  function renderTelemedDateList() {
    const countEl = el('telemedDateCount');
    if (countEl) countEl.textContent = String(state.telemedDates.length);
    const emptyEl = el('telemedDateListEmpty');
    const listEl = el('telemedDateList');
    if (!listEl) return;
    const dates = state.telemedDates || [];
    if (!dates.length) {
      if (emptyEl) emptyEl.classList.remove('d-none');
      listEl.classList.add('d-none');
      listEl.innerHTML = '';
      return;
    }
    if (emptyEl) emptyEl.classList.add('d-none');
    listEl.classList.remove('d-none');
    listEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < dates.length; i++) {
      const d = dates[i];
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'list-group-item list-group-item-action d-flex flex-wrap align-items-center gap-2 telemed-date-btn';
      item.dataset.id = d.id || '';
      item.style.justifyContent = 'flex-start';
      const left = document.createElement('div');
      left.className = 'd-flex flex-column text-start';
      left.style.flex = '1 1 auto';
      left.style.minWidth = '0';
      const dateRow = document.createElement('div');
      dateRow.className = 'fw-semibold' + (String(d.date || '').length ? '' : ' text-muted');
      dateRow.innerHTML = '<i class="fa-regular fa-calendar me-1"></i>' + escapeHtml(d.date || '-');
      const svcRow = document.createElement('div');
      svcRow.className = 'small text-muted';
      const svcLabel =
        (d.serviceCode ? escapeHtml(String(d.serviceCode)) : '') +
        (d.serviceCode && d.serviceName ? ' - ' : '') +
        (d.serviceName ? escapeHtml(String(d.serviceName)) : '');
      svcRow.textContent = svcLabel || 'ไม่ระบุหน่วยบริการ';
      left.appendChild(dateRow);
      left.appendChild(svcRow);
      const delWrap = document.createElement('span');
      delWrap.className = 'telemed-date-delete-wrap';
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn btn-outline-secondary btn-sm py-0 px-2 btn-telemed-delete-date';
      delBtn.setAttribute('data-id', d.id || '');
      delBtn.setAttribute('title', 'ลบวันที่นัด (ลบได้เฉพาะวันที่ไม่มีคนรับบริการ)');
      delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
      delBtn.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        const did = delBtn.getAttribute('data-id') || '';
        if (!did) return;
        confirmDeleteTelemedDate_(did, d);
      });
      delWrap.appendChild(delBtn);
      const ic = document.createElement('i');
      ic.className = 'fa-solid fa-chevron-right text-muted';
      item.appendChild(left);
      item.appendChild(delWrap);
      item.appendChild(ic);
      if (state.selectedTelemedDateId && d.id && state.selectedTelemedDateId === d.id) {
        item.classList.add('telemed-date-btn-active');
      }
      frag.appendChild(item);
    }
    listEl.appendChild(frag);
    listEl.querySelectorAll('.telemed-date-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        if (e.target && e.target.closest && e.target.closest('.btn-telemed-delete-date')) return;
        const id = btn.getAttribute('data-id') || '';
        if (!id) return;
        selectTelemedDate(id);
      });
    });
  }

  function confirmDeleteTelemedDate_(dateId, dRec) {
    if (!dateId) return;
    const user = getCurrentUser();
    if (!user) { handleNeedLogin(); return; }

    const hdr = dRec && dRec.date ? String(dRec.date) : '';
    const svc = dRec && dRec.serviceName ? String(dRec.serviceName) : '';

    let htmlContent = '';
    if (hdr) htmlContent += `<b>วันที่นัด:</b> ${hdr}<br>`;
    if (svc) htmlContent += `<b>หน่วยบริการ:</b> ${svc}<br>`;
    htmlContent += `<br><span style="color: #d33;">(สามารถลบได้เฉพาะวันที่ <b>ไม่มีคนรับบริการอยู่</b> เท่านั้น)</span>`;

    Swal.fire({
      title: 'ยืนยันการลบวันที่นัด?',
      html: htmlContent,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'ใช่, ลบเลย',
      cancelButtonText: 'ยกเลิก'
    }).then((result) => {
      if (!result.isConfirmed) return;

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return;
          if (res.needLogin) { handleNeedLogin(); return; }
          if (!res.success) {
            Swal.fire({
              icon: 'error',
              title: 'เกิดข้อผิดพลาด',
              text: res.message || 'ไม่สามารถลบข้อมูลได้',
              timer: 2500,
              showConfirmButton: false
            });
            return;
          }

          Swal.fire({
            icon: 'success',
            title: res.message || 'ลบวันที่นัดสำเร็จ',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 1600
          });

          if (state.selectedTelemedDateId === dateId) {
            state.selectedTelemedDateId = null;
            state.selectedTelemedDate = null;
            state.telemedRecords = [];
            const area = el('telemedDataArea');
            const noSel = el('telemedNoSelected');
            if (area) area.classList.add('d-none');
            if (noSel && (state.telemedDates || []).length) noSel.classList.remove('d-none');
            hideTelemedRecordForm();
            renderTelemedRecords();
          }
          fetchTelemedDates();
        })
        .withFailureHandler(function () {
          Swal.fire({
            icon: 'error',
            title: 'การเชื่อมต่อขัดข้อง',
            text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่',
            timer: 2000,
            showConfirmButton: false
          });
        })
        .deleteTelemedDate(dateId, user);
    });
  }

  function clearTelemedRecordSelection_() {
    state.selectedTelemedRecordId = null;
    state.telemedIsEditing = false;
    const banner = el('telemedEditingBanner');
    const bannerText = el('telemedEditingBannerText');
    if (banner) banner.classList.add('d-none');
    if (bannerText) bannerText.textContent = 'กำลังแก้ไขข้อมูล TeleMedicine';
    const tfIdsPerson = ['tf_hn', 'tf_fullName', 'tf_ht', 'tf_dm', 'tf_dlp'];
    tfIdsPerson.forEach(function (id) {
      const n = el(id);
      if (!n) return;
      n.removeAttribute('readonly');
      n.removeAttribute('disabled');
    });
  }

  function selectTelemedDate(dateId) {
    const id = String(dateId || '').trim();
    if (!id) return;
    state.selectedTelemedDateId = id;
    const found = (state.telemedDates || []).find(function (d) { return d.id === id; });
    state.selectedTelemedDate = found || null;
    clearTelemedRecordSelection_();
    renderTelemedDateList();
    const sdEl = el('telemedSelectedDate');
    const svEl = el('telemedSelectedService');
    if (sdEl) sdEl.textContent = (found && found.date) ? String(found.date) : '-';
    if (svEl) {
      let svcTxt = 'ไม่ระบุ';
      if (found) {
        svcTxt = (found.serviceCode ? String(found.serviceCode) : '') +
          (found.serviceCode && found.serviceName ? ' - ' : '') +
          (found.serviceName ? String(found.serviceName) : '');
        if (!svcTxt) svcTxt = 'ไม่ระบุ';
      }
      svEl.textContent = svcTxt;
    }
    const noSel = el('telemedNoSelected');
    const area = el('telemedDataArea');
    if (noSel) noSel.classList.add('d-none');
    if (area) area.classList.remove('d-none');
    if (el('telemedRecordCount')) el('telemedRecordCount').textContent = '0';
    hideTelemedRecordForm();
    
    const tblLoader = el('telemedTableLoader');
    const tblWrap = el('telemedTable') ? el('telemedTable').closest('.table-responsive') : null;
    if (tblLoader) tblLoader.classList.remove('d-none');
    const tbody = el('telemedTable') ? el('telemedTable').querySelector('tbody') : null;
    if (tbody) tbody.innerHTML = '';
    
    loadTelemedRecordsFor(id).finally(function() {
      if (tblLoader) tblLoader.classList.add('d-none');
    });
  }

  function loadTelemedRecordsFor(dateId) {
    return new Promise(function (resolve) {
      const user = getCurrentUser();
      if (!user) { resolve(); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) { resolve(); return; }
          if (res.needLogin) { handleNeedLogin(); resolve(); return; }
          if (!res.success) { if (res.message) toast(res.message, 'error', 2000); resolve(); return; }
          state.telemedRecords = Array.isArray(res.records) ? res.records : [];
          if (res.dateRecord) {
            state.selectedTelemedDate = res.dateRecord;
            if (!state.selectedTelemedDateId) state.selectedTelemedDateId = String(res.dateRecord.id || '');
          }
          renderTelemedRecords();
          refreshTelemedTable();
          resolve();
        })
        .withFailureHandler(function () { resolve(); })
        .getTelemedByDate(dateId, user);
    });
  }

  function renderTelemedRecords() {
    const rc = el('telemedRecordCount');
    const records = state.telemedRecords || [];
    if (rc) rc.textContent = String(records.length);
    initTelemedTable();
  }

  function refreshTelemedTable() {
    if (state.telemedTable) {
      try {
        state.telemedTable.clear();
        state.telemedTable.rows.add(state.telemedRecords || []);
        state.telemedTable.draw();
      } catch (e) {
        try { state.telemedTable.destroy(); } catch (err) {}
        state.telemedTable = null;
        initTelemedTable();
      }
    } else {
      initTelemedTable();
    }
  }

  function initTelemedTable() {
    const tblEl = el('telemedTable');
    if (!tblEl) return;
    const dataSource = state.telemedRecords || [];

    const tableButtons = [
      {
        extend: 'excelHtml5',
        text: '<i class="fa-solid fa-file-excel me-1"></i> Excel',
        className: 'btn btn-success btn-sm me-1',
        customize: function (xlsx) {
          const sheet = xlsx.xl.worksheets['sheet1.xml'];
          const selectedDate = state.selectedTelemedDate || {};
          const dateStr = selectedDate.date || '-';
          const serviceName = selectedDate.serviceName || '';
          const serviceCode = selectedDate.serviceCode || '';
          const serviceDisplay = serviceCode && serviceName ? (serviceCode + ' - ' + serviceName) : (serviceName || serviceCode || '-');

          // Replace header row with full columns
          const row = sheet.querySelector('row[r="1"]');
          if (row) {
            const headerRow = '<row r="1"><c r="A1" t="inlineStr"><is><t>ลำดับ</t></is></c><c r="B1" t="inlineStr"><is><t>HN</t></is></c><c r="C1" t="inlineStr"><is><t>ชื่อ-นามสกุล</t></is></c><c r="D1" t="inlineStr"><is><t>HT</t></is></c><c r="E1" t="inlineStr"><is><t>DM</t></is></c><c r="F1" t="inlineStr"><is><t>DLP</t></is></c><c r="G1" t="inlineStr"><is><t>โรคอื่นๆ</t></is></c><c r="H1" t="inlineStr"><is><t>เบอร์โทร</t></is></c><c r="I1" t="inlineStr"><is><t>ใบยินยอม</t></is></c><c r="J1" t="inlineStr"><is><t>หน่วยบริการ</t></is></c><c r="K1" t="inlineStr"><is><t>ห้อง TeleMed</t></is></c><c r="L1" t="inlineStr"><is><t>ผู้ให้บริการ</t></is></c><c r="M1" t="inlineStr"><is><t>นัด (เดือน)</t></is></c><c r="N1" t="inlineStr"><is><t>วันที่นัด</t></is></c><c r="O1" t="inlineStr"><is><t>หมายเหตุ</t></is></c></row>';
            row.innerHTML = headerRow;
          }

          // Rebuild data rows with full columns
          const dataRows = sheet.querySelectorAll('row[r!="1"]');
          const records = state.telemedRecords || [];
          dataRows.forEach(function (row, idx) {
            if (idx < records.length) {
              const r = records[idx];
              const rowNum = idx + 2;
              const diseases = [];
              if (r.ht) diseases.push(r.ht);
              if (r.dm) diseases.push(r.dm);
              if (r.dlp) diseases.push(r.dlp);
              if (r.otherDisease) diseases.push(r.otherDisease);

              const diseaseStr = diseases.join(', ') || '-';
              const fullName = [r.prefix, r.firstName, r.lastName].filter(Boolean).join(' ') || '-';

              const newRow = '<row r="' + rowNum + '">' +
                '<c r="A' + rowNum + '"><v>' + (idx + 1) + '</v></c>' +
                '<c r="B' + rowNum + '" t="inlineStr"><is><t>' + (r.hn || '') + '</t></is></c>' +
                '<c r="C' + rowNum + '" t="inlineStr"><is><t>' + fullName + '</t></is></c>' +
                '<c r="D' + rowNum + '" t="inlineStr"><is><t>' + (r.ht || '') + '</t></is></c>' +
                '<c r="E' + rowNum + '" t="inlineStr"><is><t>' + (r.dm || '') + '</t></is></c>' +
                '<c r="F' + rowNum + '" t="inlineStr"><is><t>' + (r.dlp || '') + '</t></is></c>' +
                '<c r="G' + rowNum + '" t="inlineStr"><is><t>' + (r.otherDisease || '') + '</t></is></c>' +
                '<c r="H' + rowNum + '" t="inlineStr"><is><t>' + (r.phone || '') + '</t></is></c>' +
                '<c r="I' + rowNum + '" t="inlineStr"><is><t>' + (r.consent || '') + '</t></is></c>' +
                '<c r="J' + rowNum + '" t="inlineStr"><is><t>' + (r.serviceName || '') + '</t></is></c>' +
                '<c r="K' + rowNum + '" t="inlineStr"><is><t>' + (r.room || '') + '</t></is></c>' +
                '<c r="L' + rowNum + '" t="inlineStr"><is><t>' + (r.provider || '') + '</t></is></c>' +
                '<c r="M' + rowNum + '" t="inlineStr"><is><t>' + (r.appointmentMonth || '') + '</t></is></c>' +
                '<c r="N' + rowNum + '" t="inlineStr"><is><t>' + (r.appointmentDate || '') + '</t></is></c>' +
                '<c r="O' + rowNum + '" t="inlineStr"><is><t>' + (r.note || '') + '</t></is></c>' +
                '</row>';
              row.innerHTML = newRow;
            }
          });
        },
        title: function () {
          const selectedDate = state.selectedTelemedDate || {};
          const dateStr = selectedDate.date || '-';
          const serviceName = selectedDate.serviceName || '';
          const serviceCode = selectedDate.serviceCode || '';
          const serviceDisplay = serviceCode && serviceName ? (serviceCode + ' - ' + serviceName) : (serviceName || serviceCode || '-');
          return 'วันที่นัด TeleMedicine : ' + dateStr + '  |  สถานที่ : ' + serviceDisplay;
        }
      },
      {
        extend: 'print',
        text: '<i class="fa-solid fa-print me-1"></i> พิมพ์',
        className: 'btn btn-secondary btn-sm me-1',
        customize: function (win) {
          const $body = jQuery(win.document.body);
          $body.css('font-size', '9pt');
          $body.find('table')
            .addClass('compact')
            .css('font-size', 'inherit');
          $body.find('h1').css({
            'text-align': 'center',
            'font-size': '12pt',
            'margin-bottom': '20px'
          });

          const selectedDate = state.selectedTelemedDate || {};
          const dateStr = selectedDate.date || '-';
          const serviceName = selectedDate.serviceName || '';
          const serviceCode = selectedDate.serviceCode || '';
          const serviceDisplay = serviceCode && serviceName ? (serviceCode + ' - ' + serviceName) : (serviceName || serviceCode || '-');
          const headerInfo = 'วันที่นัด TeleMedicine : ' + dateStr + ' | สถานที่ : ' + serviceDisplay;

          const $table = $body.find('table');
          const $thead = $table.find('thead').first();
          const $originalHeaderRow = $thead.find('tr').first();

          // Replace header with full columns for print
          const fullHeaderRow = jQuery('<tr></tr>');
          const fullHeaders = ['ลำดับ', 'HN', 'ชื่อ-นามสกุล', 'HT', 'DM', 'DLP', 'โรคอื่นๆ', 'เบอร์โทร', 'ใบยินยอม', 'หน่วยบริการ', 'ห้อง TeleMed', 'ผู้ให้บริการ', 'นัด (เดือน)', 'วันที่นัด', 'หมายเหตุ'];
          fullHeaders.forEach(function (h) {
            fullHeaderRow.append('<th>' + h + '</th>');
          });

          $originalHeaderRow.replaceWith(fullHeaderRow);

          // Add title row
          const $titleRow = jQuery('<tr></tr>');
          const $titleCell = jQuery('<th></th>')
            .attr('colspan', fullHeaders.length)
            .css({
              'text-align': 'center',
              'font-size': '11pt',
              'font-weight': 'bold',
              'padding': '10px',
              'background-color': '#f8f9fa',
              'border': '1px solid #ddd'
            })
            .text(headerInfo);
          $titleRow.append($titleCell);
          $thead.prepend($titleRow);

          // Rebuild data rows with full columns
          const $tbody = $table.find('tbody');
          const records = state.telemedRecords || [];
          $tbody.empty();

          records.forEach(function (r, idx) {
            const diseases = [];
            if (r.ht) diseases.push(r.ht);
            if (r.dm) diseases.push(r.dm);
            if (r.dlp) diseases.push(r.dlp);
            if (r.otherDisease) diseases.push(r.otherDisease);

            const diseaseStr = diseases.join(', ') || '-';
            const fullName = [r.prefix, r.firstName, r.lastName].filter(Boolean).join(' ') || '-';

            const row = '<tr>' +
              '<td>' + (idx + 1) + '</td>' +
              '<td>' + (r.hn || '') + '</td>' +
              '<td>' + fullName + '</td>' +
              '<td>' + (r.ht || '') + '</td>' +
              '<td>' + (r.dm || '') + '</td>' +
              '<td>' + (r.dlp || '') + '</td>' +
              '<td>' + (r.otherDisease || '') + '</td>' +
              '<td>' + (r.phone || '') + '</td>' +
              '<td>' + (r.consent || '') + '</td>' +
              '<td>' + (r.serviceName || '') + '</td>' +
              '<td>' + (r.room || '') + '</td>' +
              '<td>' + (r.provider || '') + '</td>' +
              '<td>' + (r.appointmentMonth || '') + '</td>' +
              '<td>' + (r.appointmentDate || '') + '</td>' +
              '<td>' + (r.note || '') + '</td>' +
              '</tr>';
            $tbody.append(row);
          });

          const style = win.document.createElement('style');
          style.innerHTML = '@page { size: A4 landscape; margin: 1cm; } @media print { table { border-collapse: collapse !important; } th, td { border: 0.5px solid #ddd !important; padding: 8px !important; } thead { display: table-header-group; } tfoot { display: table-footer-group; } }';
          win.document.head.appendChild(style);
        }
      }
    ];

    const tableDom = "<'row'<'col-sm-12 col-md-4 mb-2 mb-md-0'l><'col-sm-12 col-md-4 text-center mb-2 mb-md-0'B><'col-sm-12 col-md-4'f>>" +
                    "<'row'<'col-sm-12'tr>>" +
                    "<'row mt-2'<'col-sm-12 col-md-5'i><'col-sm-12 col-md-7'p>>";

    const langThai = {
      emptyTable: 'ยังไม่มีรายการบันทึก TeleMedicine',
      info: 'แสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ',
      infoEmpty: 'แสดง 0 ถึง 0 จากทั้งหมด 0 รายการ',
      infoFiltered: '(กรองจากทั้งหมด _MAX_ รายการ)',
      lengthMenu: 'แสดง _MENU_ รายการ',
      loadingRecords: 'กำลังโหลด...',
      processing: 'กำลังประมวลผล...',
      search: 'ค้นหา:',
      zeroRecords: 'ไม่พบรายการที่ตรงกัน',
      thousands: ',',
      paginate: {
        first: 'แรก',
        last: 'สุดท้าย',
        next: 'ถัดไป',
        previous: 'ก่อนหน้า'
      }
    };

    const commonColumns = [
      {
        title: 'ลำดับ',
        data: null,
        className: 'text-center',
        width: '40px',
        render: function (data, type, row, meta) {
          return meta.row + 1;
        }
      },
      {
        title: 'HN',
        data: null,
        width: '80px',
        render: function (data, type, row) { return escapeHtml(formatHN(row.hn || '')); }
      },
      {
        title: 'ชื่อ-นามสกุล',
        data: null,
        width: '150px',
        render: function (data, type, row) {
          const fullName = [row.prefix, row.firstName, row.lastName].filter(Boolean).join(' ');
          return escapeHtml(fullName || '-');
        }
      },
      {
        title: 'โรคประจำตัว',
        data: null,
        className: 'telemed-disease-info',
        width: '120px',
        render: function (data, type, row) {
          const diseases = [];
          if (row.ht) diseases.push('HT:' + escapeHtml(row.ht));
          if (row.dm) diseases.push('DM:' + escapeHtml(row.dm));
          if (row.dlp) diseases.push('DLP:' + escapeHtml(row.dlp));
          if (row.otherDisease) diseases.push(escapeHtml(row.otherDisease));
          if (diseases.length === 0) return '-';
          return diseases.map(d => '<span class="telemed-disease-item">' + d + '</span>').join('');
        }
      },
      {
        title: 'เบอร์โทร',
        data: null,
        width: '90px',
        render: function (data, type, row) { return escapeHtml(row.phone || '-'); }
      },
      {

        width: '180px',
        render: function (data, type, row) {
          const lines = [];
          if (row.serviceName) lines.push('<span class="telemed-service-line">' + escapeHtml(row.serviceName) + '</span>');
          if (row.room) lines.push('<span class="telemed-service-line">ห้อง: ' + escapeHtml(row.room) + '</span>');

          if (row.appointmentMonth) lines.push('<span class="telemed-service-line">อีก ' + escapeHtml(row.appointmentMonth) + ' เดือน</span>');
          if (row.appointmentDate) lines.push('<span class="telemed-service-line">' + escapeHtml(row.appointmentDate) + '</span>');

            lines.push('<span class="telemed-service-line text-muted" title="' + escapeHtml(row.note) + '">' + escapeHtml(displayNote) + '</span>');

        data: null,
        orderable: false,
        searchable: false,
        className: 'text-center',

            '</div>';

      }
    ];

    if (typeof jQuery !== 'undefined' && jQuery.fn && jQuery.fn.dataTable) {
      const $tbl = jQuery(tblEl);
      $tbl.off('click.dt-telemed-edit');
      $tbl.off('click.dt-telemed-delete');
      $tbl.on('click.dt-telemed-edit', '.btn-telemed-edit', function (e) {
        e.preventDefault();
        e.stopPropagation();
        const btn = this;
        const idx = Number(btn.getAttribute('data-idx'));
        if (isNaN(idx) || idx < 0) return;
        const rec = state.telemedRecords[idx];
        if (!rec || !rec.id) return;
        selectTelemedRecordForEdit_(rec.id);
      });
      $tbl.on('click.dt-telemed-delete', '.btn-telemed-delete-row', function (e) {
        e.preventDefault();
        e.stopPropagation();
        const btn = this;
        const idx = Number(btn.getAttribute('data-idx'));
        if (isNaN(idx) || idx < 0) return;
        const rec = state.telemedRecords[idx];
        if (!rec || !rec.id) return;
        confirmDeleteTelemedRecord_(rec);

      if (state.telemedTable) {

          state.telemedTable.clear();

          try { state.telemedTable.destroy(); } catch (err) {}

        });

  function confirmDeleteTelemedRecord_(rec) {
    if (!rec || !rec.id) return;
    const user = getCurrentUser();
    if (!user) { handleNeedLogin(); return; }

    const hn = rec.hn ? formatHN(rec.hn) : '';
    const name = [rec.prefix, rec.firstName, rec.lastName].filter(Boolean).join(' ');

    let htmlContent = '';
    htmlContent += `<b>HN:</b> ${hn || '-'}<br>`;
    htmlContent += `<b>ชื่อ-นามสกุล:</b> ${name || '-'}<br>`;
    htmlContent += `<br>ยืนยันว่าต้องการ<b>ลบรายการนี้</b>ใช่หรือไม่?`;

    Swal.fire({
      title: 'ยืนยันการลบรายการ TeleMedicine?',
      html: htmlContent,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'ใช่, ลบเลย',
      cancelButtonText: 'ยกเลิก'
    }).then((result) => {
      if (!result.isConfirmed) return;

      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return;
          if (res.needLogin) { handleNeedLogin(); return; }
          if (!res.success) {
            Swal.fire({
              icon: 'error',
              title: 'เกิดข้อผิดพลาด',
              text: res.message || 'ไม่สามารถลบข้อมูลได้',
              timer: 2500,
              showConfirmButton: false
            });
            return;
          }

          Swal.fire({
            icon: 'success',
            title: res.message || 'ลบรายการสำเร็จ',
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 1600
          });

          setTimeout(function() {
            const backdrops = document.querySelectorAll('.swal2-backdrop-show');
            backdrops.forEach(function(backdrop) {
              backdrop.remove();
            });
          }, 100);

          if (state.selectedTelemedRecordId === rec.id) {
            clearTelemedRecordSelection_();
            setTelemedFormEditingState_(false);
            resetTelemedRecordForm_();
          }

          if (state.selectedTelemedDateId) {
            loadTelemedRecordsFor(state.selectedTelemedDateId).then(function() {
              const tblEl = el('telemedTable');
              if (tblEl && state.telemedTable) {
                try {
                  state.telemedTable.clear();
                  state.telemedTable.rows.add(state.telemedRecords || []);
                  state.telemedTable.draw();
                } catch (e) {
                  try { state.telemedTable.destroy(); } catch (err) {}
                  state.telemedTable = null;
                  initTelemedTable();
                }
              } else {
                initTelemedTable();
              }
            });
          } else {
            renderTelemedRecords();
          }
        })
        .withFailureHandler(function () {
          Swal.fire({
            icon: 'error',
            title: 'การเชื่อมต่อขัดข้อง',
            text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่',
            timer: 2000,
            showConfirmButton: false
          });
        })
        .deleteTelemedRecord(rec.id, user);
    });
  }

    const user = getCurrentUser();
    if (!user) { handleNeedLogin(); return; }
    if (state.telemedIsEditing) {
      toast('ไม่สามารถค้นหา HN ขณะกำลังแก้ไขได้ (ยกเลิกการแก้ไขก่อน)', 'warning', 2000);
      return;
    }

    if (!hnVal) {
      toast('กรุณาระบุ HN ที่ต้องการค้นหาก่อน', 'warning', 1700);
      if (hnInput) hnInput.focus();
      return;
    }

    const btn = el('btnTelemedHNLookup');
    setBtnLoading(btn, '');

    google.script.run
      .withSuccessHandler(function (res) {
        resetBtn(btn);
        if (!res || res.needLogin) {
          if (res && res.needLogin) handleNeedLogin();
          return;
        }
        if (!res.success || !res.data) {
          const typedHN = hnVal;
          resetTelemedRecordForm_();
          if (hnInput) {

            hnInput.removeAttribute('disabled');

            confirmButtonColor: '#2859a8',
            confirmButtonText: 'ตกลง'
          });
          return;
        }

        const isDupe = (state.telemedRecords || []).some(function (r) {
          return String(r.hn || '').trim() === hnVal;
        });

        if (isDupe) {
          const typedHN = hnVal;
          resetTelemedRecordForm_();
          if (hnInput) {
            hnInput.value = typedHN;
            hnInput.removeAttribute('readonly');

          }
          Swal.fire({
            icon: 'warning',
            title: 'พบข้อมูลซ้ำ',
            text: 'HN ' + formatHN(hnVal) + ' มีข้อมูล TeleMedicine ในวันที่เลือกนี้อยู่แล้ว',
            confirmButtonColor: '#2859a8',
            confirmButtonText: 'ตกลง'
          });
          if (hnInput) hnInput.focus();
          return;
        }

        const p = res.data;
        const fullNameInp = el('tf_fullName');
        const htInp = el('tf_ht');
        const dmInp = el('tf_dm');
        const dlpInp = el('tf_dlp');
        
        if (fullNameInp) {
          fullNameInp.value = [p.prefix, p.firstName, p.lastName].filter(Boolean).join(' ');
          fullNameInp.setAttribute('readonly', 'readonly');
        }
        if (htInp) {
          htInp.value = p.ht || '';
          htInp.setAttribute('readonly', 'readonly');
        }
        if (dmInp) {
          dmInp.value = p.dm || '';
          dmInp.setAttribute('readonly', 'readonly');
        }
        if (dlpInp) {
          dlpInp.value = p.dlp || '';
          dlpInp.setAttribute('readonly', 'readonly');
        }
        
        Swal.fire({
          icon: 'success',
          title: 'พบข้อมูล',
          text: 'พบข้อมูล HN ' + formatHN(hnVal) + ' : ' + ([p.prefix, p.firstName, p.lastName].filter(Boolean).join(' ')),
          timer: 2500,
          showConfirmButton: false
        });

        setTimeout(function () {

  function setTelemedFormEditingState_(isEditing) {
    state.telemedIsEditing = !!isEditing;
    const btnLabel = el('btnTelemedRecordLabel');
    const submitBtn = el('btnTelemedRecordSubmit');

    const tfReadOnlyIds = ['tf_hn', 'tf_fullName', 'tf_ht', 'tf_dm', 'tf_dlp'];

    if (isEditing) {
      if (btnLabel) btnLabel.textContent = 'บันทึกการแก้ไข';
      if (submitBtn) {
        submitBtn.innerHTML = '<i class="fa-solid fa-pen me-1"></i><span id="btnTelemedRecordLabel">บันทึกการแก้ไข</span>';
      }

      ['tf_hn'].forEach(function (id) {
        const n = el(id);
        if (n) n.removeAttribute('required');
      });
    } else {
      if (btnLabel) btnLabel.textContent = 'บันทึก';
      if (submitBtn) {
        submitBtn.innerHTML = '<i class="fa-solid fa-save me-1"></i><span id="btnTelemedRecordLabel">บันทึก</span>';
      }

      ['tf_hn'].forEach(function (id) {
        const n = el(id);
        if (n) n.setAttribute('required', 'required');
      });
    }

    tfReadOnlyIds.forEach(function (id) {
      const n = el(id);
      if (!n) return;
      n.setAttribute('readonly', 'readonly');
    });
  }

  function selectTelemedRecordForEdit_(recordId) {
    const rid = String(recordId || '').trim();
    if (!rid) return;
    const found = (state.telemedRecords || []).find(function (r) { return r.id && String(r.id) === rid; });
    if (!found) return;
    state.selectedTelemedRecordId = rid;
    state.telemedIsEditing = true;
    setTelemedFormEditingState_(true);
    showTelemedRecordForm();
    populateTelemedFormFromRecord_(found);
    const banner = el('telemedEditingBanner');
    const bannerText = el('telemedEditingBannerText');
    if (banner) banner.classList.remove('d-none');
    if (bannerText) {
      const hnTxt = formatHN(found.hn || '');
      const nm = [found.prefix, found.firstName, found.lastName].filter(Boolean).join(' ');
      bannerText.textContent = 'กำลังแก้ไขข้อมูล TeleMedicine : ' + (hnTxt ? ('HN ' + hnTxt) : '') + (nm ? (' ' + nm) : '');
    }
    renderTelemedRecords();
    setTimeout(function () {
      const tgt = el('tf_otherDisease');
      if (tgt) tgt.focus();
    }, 70);
  }

  function populateTelemedFormFromRecord_(r) {
    if (!r) return;
    const e = function (id, val) {
      const node = el(id);
      if (node) node.value = (val == null) ? '' : String(val);
    };
    e('tf_hn', r.hn || '');
    e('tf_fullName', [r.prefix, r.firstName, r.lastName].filter(Boolean).join(' ') || '');
    e('tf_ht', r.ht || '');
    e('tf_dm', r.dm || '');
    e('tf_dlp', r.dlp || '');
    e('tf_otherDisease', r.otherDisease || '');
    e('tf_phone', r.phone || '');
    e('tf_details', r.details || '');
    
    const consent = r.consent || '';
    if (consent === 'มี') {
      el('tf_consentYes').checked = true;
    } else if (consent === 'ไม่มี') {
      el('tf_consentNo').checked = true;
    }
    
    e('tf_service', r.serviceCode ? JSON.stringify({code: r.serviceCode, name: r.serviceName}) : '');
    e('tf_room', r.room || '');
    e('tf_provider', r.provider || '');
    e('tf_appointmentMonth', r.appointmentMonth || '');
    e('tf_appointmentDate', r.appointmentDate || '');
    e('tf_note', r.note || '');
  }

  function resetTelemedPage_() {
    state.selectedTelemedDateId = null;
    state.selectedTelemedDate = null;
    state.telemedRecords = [];
    state.telemedIsEditing = false;
    
    hideTelemedRecordForm();
    
    const area = el('telemedDataArea');
    const noSel = el('telemedNoSelected');
    if (area) area.classList.add('d-none');
    if (noSel) noSel.classList.add('d-none');
    
    renderTelemedDateList();
    
    if (state.telemedTable) {
      try {
        state.telemedTable.clear().draw();
      } catch (e) {}
    }
  }

  function initTelemedPage() {
    const u = getCurrentUser();
    const isAdmin = u && typeof u.role === 'string' && u.role.toLowerCase() === 'admin';
    if (!isAdmin) return;
    
    const loader = el('telemedInitialLoader');
    const content = el('telemedMainContent');
    if (loader) loader.classList.remove('d-none');
    if (content) content.classList.add('d-none');

    state.telemedIsEditing = false;
    clearTelemedRecordSelection_();
    setTelemedFormEditingState_(false);
    
    fetchTelemedOptions_().then(function () {
      fetchTelemedDates().then(function () {
        if (loader) loader.classList.add('d-none');
        if (content) content.classList.remove('d-none');

        const data = state.telemedDates || [];
        const noSel = el('telemedNoSelected');
        const area = el('telemedDataArea');
        if (state.selectedTelemedDateId) {
          const exists = data.some(function (d) { return d.id === state.selectedTelemedDateId; });
          if (exists) {
            selectTelemedDate(state.selectedTelemedDateId);
            return;
          }
        }
        if (noSel && data.length) noSel.classList.remove('d-none');
        if (area) area.classList.add('d-none');
        if (noSel && !data.length) noSel.classList.add('d-none');
        
        // Initialize flatpickr after content is shown
        setTimeout(function() {
          if (typeof core.initThaiFlatpickrs === 'function') {
            try { core.initThaiFlatpickrs(); } catch (e) { /* ignore */ }
          }
        }, 100);
      });
    });
  }

  function fetchTelemedOptions_() {
    return new Promise(function (resolve) {
      const user = getCurrentUser();
      if (!user) { resolve(); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            if (res.hospitals) state.telemedHospitals = res.hospitals;
            if (res.rooms) state.telemedRooms = res.rooms;
          }
          populateTelemedDropdowns_();
          resolve();
        })
        .withFailureHandler(function () {
          populateTelemedDropdowns_();
          resolve();
        })
        .getTelemedOptions(user);
    });
  }

  function populateTelemedDropdowns_() {
    const hospitalSel = el('telemedServiceSelect');
    const serviceSel = el('tf_service');
    const roomSel = el('tf_room');
    
    const hospitals = state.telemedHospitals || [];
    const rooms = state.telemedRooms || [];
    
    let hospHtml = '<option value="">--เลือกหน่วยบริการ--</option>';
    for (let i = 0; i < hospitals.length; i++) {
      const h = hospitals[i];
      const code = h.code || '';
      const name = h.name || '';
      if (!code && !name) continue;
      const jsonVal = JSON.stringify({code: code, name: name});
      hospHtml += '<option value="' + escapeHtml(jsonVal) + '">' + escapeHtml((code ? code + ' - ' : '') + name) + '</option>';
    }
    if (hospitalSel) hospitalSel.innerHTML = hospHtml;
    if (serviceSel) serviceSel.innerHTML = hospHtml;
    
    let roomHtml = '<option value="">--เลือกห้อง--</option>';
    for (let i = 0; i < rooms.length; i++) {
      const r = rooms[i];
      if (!r) continue;
      roomHtml += '<option value="' + escapeHtml(String(r)) + '">' + escapeHtml(String(r)) + '</option>';
    }
    if (roomSel) roomSel.innerHTML = roomHtml;
  }

  function showTelemedRecordForm() {
    const card = el('telemedFormCard');
    if (!card) return;
    card.classList.remove('d-none');
    state.telemedFormVisible = true;
    setTelemedFormEditingState_(!!state.telemedIsEditing);
    const focusTarget = state.telemedIsEditing ? el('tf_otherDisease') : el('tf_hn');
    setTimeout(function () { if (focusTarget) focusTarget.focus(); }, 60);
  }

  function hideTelemedRecordForm() {
    const card = el('telemedFormCard');
    if (!card) return;
    card.classList.add('d-none');
    state.telemedFormVisible = false;
    state.telemedIsEditing = false;
    clearTelemedRecordSelection_();
    const form = el('telemedRecordForm');
    if (form) {
      form.classList.remove('was-validated');
      form.reset();
    }
    resetTelemedRecordForm_();
    setTelemedFormEditingState_(false);
    renderTelemedRecords();
  }

  function resetTelemedRecordForm_() {
    const form = el('telemedRecordForm');
    if (!form) return;
    form.classList.remove('was-validated');
    ['tf_hn','tf_fullName','tf_ht','tf_dm','tf_dlp','tf_otherDisease','tf_phone','tf_details','tf_service','tf_room','tf_provider','tf_appointmentMonth','tf_appointmentDate','tf_note'].forEach(function (id) {
      const e = el(id);
      if (e) e.value = '';
    });

    if (el('tf_consentYes')) el('tf_consentYes').checked = false;
    if (el('tf_consentNo')) el('tf_consentNo').checked = false;

    // Reset appointment month hint
    const hint = el('tf_appointmentMonthHint');
    if (hint) {
      hint.style.display = 'none';
      hint.textContent = '';
    }

    populateTelemedDropdowns_();

    ['tf_hn', 'tf_fullName', 'tf_ht', 'tf_dm', 'tf_dlp'].forEach(function(id) {
      const e = el(id);
      if (e) {
        e.setAttribute('readonly', 'readonly');
      }
    });
  }

  function calculateAppointmentMonth_() {
    const monthSelect = el('tf_appointmentMonth');
    const hint = el('tf_appointmentMonthHint');
    if (!monthSelect || !hint) return;

    const months = parseInt(monthSelect.value, 10);
    if (!months || isNaN(months)) {
      hint.style.display = 'none';
      hint.textContent = '';
      return;
    }

    const today = new Date();
    const futureDate = new Date(today);
    futureDate.setMonth(today.getMonth() + months);

    const thaiMonths = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];

    const thaiYear = futureDate.getFullYear() + 543;
    const thaiMonth = thaiMonths[futureDate.getMonth()];

    hint.textContent = 'อีก ' + months + ' เดือนจะเป็น ' + thaiMonth + ' ' + thaiYear;
    hint.style.display = 'block';
  }

  function submitTelemedDate(e) {
    if (e) e.preventDefault();
    const user = getCurrentUser();
    if (!user) { handleNeedLogin(); return; }
    const form = el('telemedDateForm');
    if (form && !form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }
    if (form) form.classList.remove('was-validated');
    const sv = el('telemedServiceSelect') ? el('telemedServiceSelect').value : '';
    const parsed = getTelemedHospitalFromSelect_(sv);
    const dateRaw = el('telemedDateInput') ? el('telemedDateInput').value : '';
    if (!dateRaw || !String(dateRaw).trim()) {
      toast('กรุณาระบุ วันที่นัด', 'warning', 1800);
      return;
    }
    const btn = el('btnTelemedDateSubmit');
    const payload = {
      date: String(dateRaw).trim(),
      serviceCode: parsed.code || '',
      serviceName: parsed.name || ''
    };
    setBtnLoading(btn, 'กำลังบันทึก...');
    google.script.run
      .withSuccessHandler(function (res) {
        resetBtn(btn);
        if (!res) return;
        if (res.needLogin) { handleNeedLogin(); return; }
        if (!res.success) {
          if (res.message) toast(res.message, 'error', 2200);
          return;
        }
        toast(res.message || 'เพิ่มวันที่นัดสำเร็จ', 'success', 1700);
        if (form) form.reset();
        const dfp = state.datepickers && state.datepickers['telemedDateInput'];
        if (dfp) { try { dfp.clear(); } catch (e) {} }
        fetchTelemedDates().then(function () {
          if (res.record && res.record.id) {
            setTimeout(function () { selectTelemedDate(res.record.id); }, 60);
          }
        });
      })
      .withFailureHandler(function () {
        resetBtn(btn);
        toast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่', 'error', 2000);
      })
      .createTelemedDate(payload, user);
  }

  function submitTelemedRecord(e) {
    if (e) e.preventDefault();
    const user = getCurrentUser();
    if (!user) { handleNeedLogin(); return; }
    const dateId = String(state.selectedTelemedDateId || '').trim();
    if (!dateId) { toast('กรุณาเลือกวันที่นัดก่อน', 'warning', 1700); return; }
    const form = el('telemedRecordForm');
    const isEditing = !!state.telemedIsEditing;
    if (!isEditing) {
      if (form && !form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }
    }
    if (form) form.classList.remove('was-validated');
    
    const payload = {
      hn: el('tf_hn') ? String(el('tf_hn').value || '').trim() : '',
      prefix: '',
      firstName: '',
      lastName: '',
      ht: el('tf_ht') ? String(el('tf_ht').value || '').trim() : '',
      dm: el('tf_dm') ? String(el('tf_dm').value || '').trim() : '',
      dlp: el('tf_dlp') ? String(el('tf_dlp').value || '').trim() : '',
      otherDisease: el('tf_otherDisease') ? String(el('tf_otherDisease').value || '').trim() : '',
      phone: el('tf_phone') ? String(el('tf_phone').value || '').trim() : '',
      details: el('tf_details') ? String(el('tf_details').value || '').trim() : '',
      consent: '',
      serviceCode: '',
      serviceName: '',
      room: el('tf_room') ? String(el('tf_room').value || '').trim() : '',
      provider: el('tf_provider') ? String(el('tf_provider').value || '').trim() : '',
      appointmentMonth: el('tf_appointmentMonth') ? String(el('tf_appointmentMonth').value || '').trim() : '',
      appointmentDate: el('tf_appointmentDate') ? String(el('tf_appointmentDate').value || '').trim() : '',
      note: el('tf_note') ? String(el('tf_note').value || '').trim() : ''
    };
    
    const consentYes = el('tf_consentYes');
    const consentNo = el('tf_consentNo');
    if (consentYes && consentYes.checked) {
      payload.consent = 'มี';
    } else if (consentNo && consentNo.checked) {
      payload.consent = 'ไม่มี';
    }
    
    const serviceVal = el('tf_service') ? el('tf_service').value : '';
    const parsed = getTelemedHospitalFromSelect_(serviceVal);
    payload.serviceCode = parsed.code || '';
    payload.serviceName = parsed.name || '';
    
    const fullName = el('tf_fullName') ? String(el('tf_fullName').value || '').trim() : '';
    const nameParts = fullName.split(' ');
    if (nameParts.length >= 3) {
      payload.prefix = nameParts[0];
      payload.firstName = nameParts[1];
      payload.lastName = nameParts.slice(2).join(' ');
    } else if (nameParts.length === 2) {
      payload.firstName = nameParts[0];
      payload.lastName = nameParts[1];
    } else if (nameParts.length === 1) {
      payload.firstName = nameParts[0];
    }
    
    const btn = el('btnTelemedRecordSubmit');
    if (!isEditing) {
      setBtnLoading(btn, 'กำลังบันทึก...');
      google.script.run
        .withSuccessHandler(function (res) {
          resetBtn(btn);
          if (!res) return;
          if (res.needLogin) { handleNeedLogin(); return; }
          if (!res.success) {
            if (res.message) toast(res.message, 'error', 2200);
            return;
          }
          toast(res.message || 'บันทึกสำเร็จ', 'success', 1600);
          resetTelemedRecordForm_();
          loadTelemedRecordsFor(dateId).then(function () {
            state.telemedRecords = state.telemedRecords || [];
            renderTelemedRecords();
            if (state.telemedTable) {
              try {
                state.telemedTable.clear();
                state.telemedTable.rows.add(state.telemedRecords);
                state.telemedTable.draw();
              } catch (e) {
                try { state.telemedTable.destroy(); } catch (err) {}
                state.telemedTable = null;
                initTelemedTable();
              }
            } else {
              initTelemedTable();
            }
            const hn = el('tf_hn');
            if (hn) hn.focus();
          });
        })
        .withFailureHandler(function () {
          resetBtn(btn);
          toast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่', 'error', 2000);
        })
        .addTelemedRecord(dateId, payload, user);
    } else {
      const rid = String(state.selectedTelemedRecordId || '').trim();
      if (!rid) { toast('กรุณาเลือกรายการจากตารางด้านล่างก่อน', 'warning', 1700); return; }
      
      const patch = {
        ht: payload.ht,
        dm: payload.dm,
        dlp: payload.dlp,
        otherDisease: payload.otherDisease,
        phone: payload.phone,
        details: payload.details,
        consent: payload.consent,
        serviceCode: payload.serviceCode,
        serviceName: payload.serviceName,
        room: payload.room,
        provider: payload.provider,
        appointmentMonth: payload.appointmentMonth,
        appointmentDate: payload.appointmentDate,
        note: payload.note
      };
      setBtnLoading(btn, 'กำลังบันทึกการแก้ไข...');
      google.script.run
        .withSuccessHandler(function (res) {
          resetBtn(btn);
          if (!res) return;
          if (res.needLogin) { handleNeedLogin(); return; }
          if (!res.success) {
            if (res.message) toast(res.message, 'error', 2200);
            return;
          }
          toast(res.message || 'บันทึกการแก้ไขสำเร็จ', 'success', 1600);
          clearTelemedRecordSelection_();
          resetTelemedRecordForm_();
          state.telemedIsEditing = false;
          setTelemedFormEditingState_(false);
          hideTelemedRecordForm();
          loadTelemedRecordsFor(dateId).then(function() {
            refreshTelemedTable();
          });
        })
        .withFailureHandler(function () {
          resetBtn(btn);
          toast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่', 'error', 2000);
        })
        .updateTelemedRecord(rid, patch, user);
    }
  }

  function initTelemedEvents_() {
    if (el('telemedServiceSelect')) {
      el('telemedServiceSelect').addEventListener('change', function () {
        const svcVal = this.value;
        const dateInp = el('telemedDateInput');
        if (!dateInp) return;
        if (svcVal) {
          setTimeout(function () {
            const fp = (state.datepickers || {})['telemedDateInput'];
            if (fp) fp.open();
            else dateInp.focus();
          }, 100);
        } else {
          dateInp.value = '';
          const fp = (state.datepickers || {})['telemedDateInput'];
          if (fp) fp.clear();
        }
      });
    }
    if (el('telemedDateInput')) {
      el('telemedDateInput').addEventListener('click', function () {
        const fp = (state.datepickers || {})['telemedDateInput'];
        if (fp) fp.open();
      });
    }
    if (el('btnTelemedRefresh')) {
      el('btnTelemedRefresh').addEventListener('click', function () {
        const btn = el('btnTelemedRefresh');
        setBtnLoading(btn, 'กำลังรีเฟรช...');
        hideTelemedRecordForm();
        if (state.telemedTable && typeof state.telemedTable.search === 'function') {
          try {
            state.telemedTable.search('').columns().search('').draw();
          } catch (e) {}
        }
        fetchTelemedDates().then(function () {
          const data = state.telemedDates || [];
          const noSel = el('telemedNoSelected');
          const area = el('telemedDataArea');
          if (state.selectedTelemedDateId) {
            const exists = data.some(function (d) { return d.id === state.selectedTelemedDateId; });
            if (exists) {
              loadTelemedRecordsFor(state.selectedTelemedDateId);
            } else {
              state.selectedTelemedDateId = null;
              state.selectedTelemedDate = null;
              if (noSel && data.length) noSel.classList.remove('d-none');
              if (area) area.classList.add('d-none');
              if (noSel && !data.length) noSel.classList.add('d-none');
            }
          }
        }).finally(function () {
          resetBtn(btn);
          toast('รีเฟรชรายการ TeleMedicine สำเร็จ', 'success', 1500);
        });
      });
    }
    if (el('telemedDateForm')) {
      el('telemedDateForm').addEventListener('submit', function (e) {
        e.preventDefault();
        submitTelemedDate(e);
      });
    }
    if (el('btnTelemedAddPerson')) {
      el('btnTelemedAddPerson').addEventListener('click', function () {
        if (!state.selectedTelemedDateId) {
          toast('กรุณาเลือกวันที่นัดจากรายการด้านซ้ายก่อน', 'warning', 2000);
          return;
        }
        state.telemedIsEditing = false;
        clearTelemedRecordSelection_();
        resetTelemedRecordForm_();
        setTelemedFormEditingState_(false);
        showTelemedRecordForm();

        const hn = el('tf_hn');
        if (hn) {
          hn.removeAttribute('readonly');
          hn.focus();
        }
      });
    }
    if (el('telemedClearSelection')) {
      el('telemedClearSelection').addEventListener('click', function () {
        state.telemedIsEditing = false;
        clearTelemedRecordSelection_();
        resetTelemedRecordForm_();
        setTelemedFormEditingState_(false);
        renderTelemedRecords();
        setTimeout(function () {
          const hn = el('tf_hn');
          if (hn) hn.focus();
        }, 50);
      });
    }
    if (el('btnTelemedFormCancel')) {
      el('btnTelemedFormCancel').addEventListener('click', function () {
        hideTelemedRecordForm();
      });
    }
    if (el('telemedRecordForm')) {
      el('telemedRecordForm').addEventListener('submit', function (e) {
        e.preventDefault();
        submitTelemedRecord(e);
      });
      el('telemedRecordForm').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          return false;
        }
      });
    }
    if (el('btnTelemedHNLookup')) {
      el('btnTelemedHNLookup').addEventListener('click', telemedHNLookupClick_);
    }
    if (el('tf_hn')) {
      el('tf_hn').addEventListener('blur', function () {
        const hnVal = String(el('tf_hn').value || '').trim();
        if (!hnVal) return;
        if (state.telemedIsEditing) return;

        const isDupe = (state.telemedRecords || []).some(function (r) {
          return String(r.hn || '').trim() === hnVal;
        });
        if (isDupe) {
          const typedHN = hnVal;
          resetTelemedRecordForm_();
          const hnInp = el('tf_hn');
          if (hnInp) {
            hnInp.value = typedHN;
            hnInp.removeAttribute('readonly');
            hnInp.removeAttribute('disabled');
          }
          Swal.fire({
            icon: 'warning',
            title: 'พบข้อมูลซ้ำ',
            text: 'HN ' + formatHN(hnVal) + ' มีข้อมูล TeleMedicine ในวันที่เลือกนี้อยู่แล้ว',
            confirmButtonColor: '#2859a8',
            confirmButtonText: 'ตกลง'
          });
          if (hnInp) hnInp.focus();
          return;
        }

        const user = getCurrentUser();
        if (!user) { handleNeedLogin(); return; }
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || !res.success || !res.data) {
              const typedHN = hnVal;
              resetTelemedRecordForm_();
              const hnInp = el('tf_hn');
              if (hnInp) {
                hnInp.value = typedHN;
                hnInp.removeAttribute('readonly');
                hnInp.removeAttribute('disabled');
              }
              return;
            }
            const p = res.data;
            const fullNameInp = el('tf_fullName');
            const htInp = el('tf_ht');
            const dmInp = el('tf_dm');
            const dlpInp = el('tf_dlp');
            
            if (fullNameInp) {
              fullNameInp.value = [p.prefix, p.firstName, p.lastName].filter(Boolean).join(' ');
              fullNameInp.setAttribute('readonly', 'readonly');
            }
            if (htInp) {
              htInp.value = p.ht || '';
              htInp.setAttribute('readonly', 'readonly');
            }
            if (dmInp) {
              dmInp.value = p.dm || '';
              dmInp.setAttribute('readonly', 'readonly');
            }
            if (dlpInp) {
              dlpInp.value = p.dlp || '';
              dlpInp.setAttribute('readonly', 'readonly');
            }
          })
          .withFailureHandler(function () {})
          .getPersonByHN(hnVal, user);
      });
    }

    // Add event listener for appointment month calculation
    if (el('tf_appointmentMonth')) {
      el('tf_appointmentMonth').addEventListener('change', calculateAppointmentMonth_);
    }
  }

  NCDApp.registerModule('telemed', {
    initPage: initTelemedPage,
    resetPage: resetTelemedPage_,
    initEvents: initTelemedEvents_
  });
})(window.NCDApp);

// Telemed module loaded - Updated v6

</script>
